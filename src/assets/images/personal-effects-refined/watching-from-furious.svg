  <text x="98" y="345" font-family="Satoshi, Arial, sans-serif" font-size="26" fill="#37322f">a mysterious town.</text><text x="98" y="384" font-family="Satoshi, Arial, sans-serif" font-size="26" fill="#37322f">no way out.</text><text x="98" y="423" font-family="Satoshi, Arial, sans-serif" font-size="26" fill="#37322f">questions at every turn.</text><text x="98" y="514" font-size="23" font-weight="700">ON</text><text x="98" y="557" font-size="31" font-weight="700" fill="#4e43ff">MGM+</text>
  <text x="574" y="345" font-family="Satoshi, Arial, sans-serif" font-size="26" fill="#37322f">how victimhood can</text><text x="574" y="384" font-family="Satoshi, Arial, sans-serif" font-size="26" fill="#37322f">change you—and how</text><text x="574" y="423" font-family="Satoshi, Arial, sans-serif" font-size="26" fill="#37322f">far is too far for revenge.</text><text x="574" y="514" font-size="23" font-weight="700">ON</text><text x="574" y="557" font-size="31" font-weight="700" fill="#4e43ff">HULU</text><text x="309" y="629" font-family="cursive" font-size="27" fill="#3e3935">⌁ we have theories.</text></g></g>
