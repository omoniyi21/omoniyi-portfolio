  <text x="96" y="248" fill="#756e86" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="5">SENIOR PRODUCT DESIGNER</text>
  <text x="91" y="356" fill="#17151d" font-family="Arial, sans-serif" font-size="83" font-weight="700" letter-spacing="-5">I help people</text>
  <text x="91" y="442" fill="#17151d" font-family="Arial, sans-serif" font-size="83" font-weight="700" letter-spacing="-5">navigate complex systems.</text>
  <text x="96" y="529" fill="#5f5967" font-family="Arial, sans-serif" font-size="28">Clarity and beauty for products, services, and systems.</text>
