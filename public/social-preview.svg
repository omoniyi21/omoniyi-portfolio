<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Omoniyi Alimi — Senior Product Designer</title>
  <desc id="desc">A warm butter-yellow portfolio share image with Omoniyi Alimi's black and pink star logo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#fff8d8"/>
      <stop offset="1" stop-color="#fff0b5"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8377bc" stroke-opacity=".12"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feFlood flood-color="#ff4fa3" flood-opacity=".55" result="c"/>
      <feComposite in="c" in2="b" operator="in"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="108" cy="104" r="38" fill="#151515"/>
