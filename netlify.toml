[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The SPA fallback lives in public/_redirects (merged with the exact page
# rewrites at build time). Unknown URLs get the app shell with a 404 status.

# Public canonical URLs omit trailing slashes; the edge function redirects them.
[build.processing.html]
  pretty_urls = false
